services:
  - type: web
    name: ai-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: REDIS_URL
        value: redis://placeholder:6379/0
      - key: CORS_ORIGINS
        sync: false
